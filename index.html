<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Python Tutr - 1000 Python Problems</title>
  <link rel="stylesheet" href="style.css">
  <!-- Prism.js for clean Python syntax highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
</head>
<body>

  <header class="header">
    <div class="logo">🐍 Python Tutr</div>
    <div class="stats" id="progress-stat">Problem 1 of 1000</div>
  </header>

  <main class="container">
    <div class="card">
      <div class="card-header">
        <span class="badge" id="problem-difficulty">Beginner</span>
        <span class="category" id="problem-category">App Development</span>
      </div>

      <h1 class="problem-title" id="problem-title">Loading problem...</h1>
      <p class="problem-desc" id="problem-desc"></p>

      <div class="actions">
        <button id="btn-done" class="btn btn-done">Done / Show Solution ✨</button>
        <button id="btn-next" class="btn btn-next">Next Problem ➡️</button>
      </div>

      <!-- Smooth animated solution box -->
      <div id="solution-container" class="solution-container">
        <div class="solution-header">
          <span>Solution (Python)</span>
          <button id="btn-copy" class="btn-copy">Copy Code</button>
        </div>
        <pre><code id="solution-code" class="language-python"></code></pre>
      </div>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
